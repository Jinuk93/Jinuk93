name: Update Until Blog Grass

on:
  workflow_dispatch:
  schedule:
    # 매일 0시(UTC)에 실행
    - cron: '0 0 * * *'

jobs:
  update-grass:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer (no-save)
        run: npm install puppeteer --no-save

      - name: Scrape Until Blog Grass
        run: |
          node << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            // Chromium 실행
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
              headless: true
            });

            const page = await browser.newPage();
            // 자신의 Blog URL 입력
            await page.goto('https://until.blog/@rlawlsdnr03', { waitUntil: 'networkidle2' });
            await page.waitForSelector('svg.react-activity-calendar__calendar', { timeout: 60000 });

            // SVG만 추출
            const svg = await page.$eval(
              'svg.react-activity-calendar__calendar',
              el => {
                el.removeAttribute('class');
                el.querySelectorAll('script').forEach(s => s.remove());
                return el.outerHTML;
              }
            );

            // 파일로 저장
            fs.writeFileSync('until-grass.svg', svg);
            await browser.close();
          })();
          EOF

      - name: Commit & Push until-grass.svg
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Update Until grass [skip ci]'
          file_pattern: 'until-grass.svg'
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
