name: Update Until Grass

on:
  schedule:
    # 매일 새벽 1시에 실행 (원하시는 스케줄로 바꿔주세요)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install puppeteer-core chrome-aws-lambda

      - name: Generate until-grass.svg
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            // 크롬 실행 옵션 (환경에 맞게 executablePath 조정)
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome-stable'
            });
            const page = await browser.newPage();

            // 블로그 페이지로 이동
            await page.goto('https://until.blog/@rlawlsdnr03', { waitUntil: 'networkidle0' });
            // 캘린더 SVG가 로드될 때까지 대기
            await page.waitForSelector('svg.react-activity-calendar__calendar', { timeout: 60000 });

            // SVG outerHTML 추출
            const rawSvg = await page.$eval(
              'svg.react-activity-calendar__calendar',
              el => el.outerHTML
            );

            // <script> 태그 전부 제거
            const cleanedSvg = rawSvg
              .replace(/<script[\s\S]*?<\/script>/g, '')
              .replace(/<script\s*\/>/g, '');

            // 파일로 쓰기
            fs.writeFileSync('until-grass.svg', cleanedSvg);

            await browser.close();
          })();
          EOF

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          file_pattern: until-grass.svg
          commit_message: 'Update until-grass.svg [skip ci]'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
