# .github/workflows/until-grass.yml

name: Update Until Blog Grass
on:
  schedule:       # 매일 자정에 실행
    - cron: "0 0 * * *"
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  fetch-grass:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install puppeteer
        run: npm install puppeteer

      - name: Scrape Grass SVG
        run: |
          node << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
            const page = await browser.newPage();

            // Until 블로그 페이지 로드
            await page.goto('https://until.blog/@rlawlsdnr03/', { waitUntil: 'networkidle0' });

            // 렌더링 안정화를 위해 잠시 대기
            await new Promise(res => setTimeout(res, 3000));

            // 페이지 끝까지 스크롤 (lazy-load 방지)
            await page.evaluate(() => window.scrollBy(0, document.body.scrollHeight));

            // 추가 대기
            await new Promise(res => setTimeout(res, 2000));

            // 잔디 캘린더 SVG 선택자 대기 (최대 60초)
            await page.waitForSelector('svg.react-activity-calendar__calendar', { timeout: 60000 });

            // SVG 추출 및 파일 저장
            const svgEl = await page.$('svg.react-activity-calendar__calendar');
            const svg = await svgEl.evaluate(el => el.outerHTML);
            fs.writeFileSync('until-grass.svg', svg);

            await browser.close();
          })();
          EOF

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add until-grass.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update Until grass [skip ci]"
            git push
          fi
