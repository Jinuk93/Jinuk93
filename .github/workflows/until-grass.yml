# .github/workflows/until-grass.yml
name: Update Until Grass

permissions:
  contents: write

on:
  schedule:
    # 매일 새벽 1시에 실행
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install puppeteer-core chrome-aws-lambda

      - name: Generate until-grass.svg
        run: |
          node << 'EOF'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox','--disable-setuid-sandbox'],
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome-stable'
            });
            const page = await browser.newPage();
            await page.goto('https://until.blog/@rlawlsdnr03', { waitUntil: 'networkidle0' });
            await page.waitForSelector('svg.react-activity-calendar__calendar', { timeout: 60000 });
            const rawSvg = await page.$eval('svg.react-activity-calendar__calendar', el => el.outerHTML);
            const cleanedSvg = rawSvg
              .replace(/<script[\s\S]*?<\/script>/g, '')
              .replace(/<script\s*\/>/g, '');
            fs.writeFileSync('until-grass.svg', cleanedSvg);
            await browser.close();
          })();
          EOF

      - name: Sanitize & Inject xmlns
        run: |
          # 1) &nbsp; → 일반 공백으로 변환
          sed -i 's/&nbsp;/ /g' until-grass.svg
          # 2) XML 선언 추가
          if ! grep -q '<?xml' until-grass.svg; then
            sed -i '1i<?xml version="1.0" encoding="UTF-8"?>' until-grass.svg
          fi
          # 3) xmlns 속성 삽입
          if ! grep -q 'xmlns=' until-grass.svg; then
            sed -i '1s|<svg |<svg xmlns="http://www.w3.org/2000/svg" |' until-grass.svg
          fi

      - name: Strip out any leftover <script> tags
        run: |
          # <script> 또는 </script>가 남아있다면 모두 삭제
          sed -i '/<script\|<\/script>/d' until-grass.svg

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_pattern: until-grass.svg
          commit_message: 'Update until-grass.svg [skip ci]'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
